# SPDX-License-Identifier: LGPL-2.1-or-later

[package]
name = "uapi16"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reading, checking and writing UAPI.16 file manifests"
repository = "https://github.com/systemd/uapi16"
keywords = ["uapi", "manifest", "filesystem", "systemd", "json-seq"]
categories = ["filesystem", "parser-implementations", "encoding"]
# What the package cargo publish uploads holds next to Cargo.toml and
# Cargo.lock.
include = ["/*.rs", "/refused.jsonl", "/tests/", "/README.md", "/LICENSE"]

[lib]
path = "lib.rs"

[dependencies]
serde_core.workspace = true
# Without float_roundtrip serde_json refuses some spellings of the largest
# doubles as out of range, such as 1.7976931348623158e308.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true

# uapi16 supports Linux only. A build for another system fails with the
# error of lib.rs, and builds neither of the two for it.
[target.'cfg(target_os = "linux")'.dependencies]
# PinnedDirectory.
pathrs.workspace = true
# PinnedDirectory, and the device numbers of FileObject::from_metadata().
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
# The errno values of the errors the tests make.
libc.workspace = true
# The tests look at the order of the keys the writer writes.
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
